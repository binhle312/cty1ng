# Weekly dependency updates (docs/security.md §2.11). New dependencies still need the owner's
# approval (AGENTS.md §7); Dependabot only updates the ones we have.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # The major of @types/node follows "engines" in package.json. It changes only with the Node
    # version, in a PR that the owner approves (D34).
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
