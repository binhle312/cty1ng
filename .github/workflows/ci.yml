# CI gates (testing.md §4). All must pass to merge. M0b adds the frontend gates:
# Playwright, generated-client freshness and the bundle budget.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test, repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # pnpm at the exact version pinned in package.json `packageManager`. Installed with npm
      # rather than corepack: pnpm 12 fetches its native binary on first run with a 30 s limit,
      # which times out on the runners; npm fetches the same binary as a normal package.
      - name: Install pnpm
        run: npm install --global "@pnpm/exe@$(node -p "require('./package.json').packageManager.split('@')[1]")"

      - name: Install (lockfile must be current)
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint, Prettier, import rules)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Folder indexes
        run: pnpm check:index

      - name: Event type lists
        run: pnpm check:events

      - name: Schema and migrations agree
        run: pnpm --filter @cty1ng/backend db:check

      - name: Audit dependencies
        run: pnpm audit --audit-level high
