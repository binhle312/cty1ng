# The tool catalog (docs/domain-model.md §4.1, D55). Checked in. The Create page and the bot
# page build the Tools list from it (docs/design/components/create-bot-page.md §3).
#
# kind: internal = run by this app | provider = run on the provider's servers
# job: tools with the same job are one row; only one can be on
# switch: open = the owner's choice is saved | later = forced off until its milestone (D53)
#         | locked = forced off, needs a decision (D55)
# needs: tool ids that must be on
#
# The owner approved every line in the M2a PR (#57, 2026-11-01).

# Internal tools (phase 1). Each is `open`: its saved switch waits for the slice that builds it.
- id: files
  label: Files
  kind: internal
  job: files
  added: 2026-10-24
  sends_data_out: false
  web: false
  line: "List, read and write files in the Library (the project's, or Home)."
  off_line: "The bot cannot list, read or write Library files. View images and Hand off turn off too."
  switch: open

- id: view_images
  label: View images
  kind: internal
  job: view_images
  added: 2026-10-24
  sends_data_out: false
  web: false
  line: "Look at PNG, JPEG and WebP files in the Library."
  needs: [files]
  switch: open

- id: skills
  label: Skills
  kind: internal
  job: skills
  added: 2026-10-24
  sends_data_out: false
  web: false
  line: "Load a skill when it needs one. Draft a new skill for you to approve."
  off_line: "Only skills set to Always load reach the bot."
  switch: open

- id: hand_off
  label: Hand off
  kind: internal
  job: hand_off
  added: 2026-10-24
  sends_data_out: false
  web: false
  line: "Ask you to pass files to another bot."
  needs: [files]
  switch: open

- id: memory
  label: Memory
  kind: internal
  job: memory
  added: 2026-10-24
  sends_data_out: false
  web: false
  line: "Remember and update facts, with Undo."
  off_line: "The bot still reads memory, but cannot save."
  switch: open

