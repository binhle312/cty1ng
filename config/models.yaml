# The model catalog (docs/domain-model.md §4). Checked in; no secrets: `api_key_env` is the
# name of the variable that holds the key. Ids, efforts, defaults and context windows were
# checked in the provider docs on 2026-11-01 (M2 plan, #57: P1 for Anthropic, P8 for Google).
#
# Order is the catalog order (M2 plan, decision 11): the Create page lists models in it, and
# `make seed` gives a new seed bot the first model whose key is set.
#
# efforts: the levels the model takes, least thinking first; [] = no setting.
# provider_tools: ids from config/tools.yaml with the same provider.
# price_override_per_mtok: optional {input, output, cache_read, cache_write} in USD (D21).

- id: google:gemini-3.8-flash
  label: Gemini 3.8 Flash
  api_key_env: GEMINI_API_KEY
  efforts: [low, medium, high]
  default_effort: medium
  multimodal: true
  context_window: 1048576
  provider_tools: [google_search, url_context, google_code_execution]

