# The three packages of architecture.md §4. backend/ and frontend/ come in M0b and M0c.
packages:
  - shared
  - backend
  - frontend

# Install scripts run only for native packages listed here as true (security.md §2.11).
# esbuild ships its binary as an optional platform package, so its script is not needed.
# @scarf/scarf (through swagger-ui-dist) only sends install analytics, so it never runs.
allowBuilds:
  better-sqlite3: true
  esbuild: false
  "@scarf/scarf": false

# Refuse to install on a Node version outside "engines" (Node 24 LTS, D34).
engineStrict: true

minimumReleaseAgeExclude:
  - lucide-react@1.65.0
