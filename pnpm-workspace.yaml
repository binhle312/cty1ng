# The three packages of architecture.md §4. backend/ and frontend/ come in M0b and M0c.
packages:
  - shared
  - backend
  - frontend

# Install scripts run only for native packages listed here as true (security.md §2.11).
# esbuild ships its binary as an optional platform package, so its script is not needed.
# @scarf/scarf (through swagger-ui-dist) only sends install analytics, so it never runs.
allowBuilds:
  better-sqlite3: true
  esbuild: false
  "@scarf/scarf": false

# Refuse to install on a Node version outside "engines" (Node 24 LTS, D34; 24.15 or newer,
# because jsdom 30 needs it).
engineStrict: true

# @hey-api/json-schema-ref-parser pins js-yaml 4.2.0, which has three high advisories
# (GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj, GHSA-2883-xcg3-v3hh). 4.3.2 fixes them in the same
# major version. Remove this when the ref parser allows it (M0c, #49).
overrides:
  "@hey-api/json-schema-ref-parser>js-yaml": 4.3.2
