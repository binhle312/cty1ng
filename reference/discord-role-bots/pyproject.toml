[project]
name = "rolebots"
version = "0.1.0"
description = "Role-playing AI bots (BA, designer) that work with you in Discord project channels, on any model provider"
requires-python = ">=3.11"
dependencies = [
    "pydantic-ai-slim[openai,anthropic]>=2.57",
    "discord.py>=2.7",
    "aiosqlite>=0.22",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.4"]

[project.scripts]
rolebots = "rolebots.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rolebots*"]
